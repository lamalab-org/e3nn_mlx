[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "e3nn-mlx"
dynamic = ["version"]
description = "Euclidean neural networks for MLX"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Rostislav Fedorov"},
]
keywords = [
  "equivariance",
  "e3nn",
  "machine-learning",
  "mlx",
  "molecular-modeling",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "mlx>=0.31,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx[cpu]>=0.31,<0.33; sys_platform == 'linux'",
  "numpy>=2,<3",
]

[project.urls]
Homepage = "https://github.com/lamalab-org/e3nn_mlx"
Changelog = "https://github.com/lamalab-org/e3nn_mlx/blob/main/CHANGELOG.md"
Documentation = "https://lamalab-org.github.io/e3nn_mlx/"
Issues = "https://github.com/lamalab-org/e3nn_mlx/issues"
Repository = "https://github.com/lamalab-org/e3nn_mlx.git"

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
  "numpy>=2.3,<3",
]

reference = [
  "e3nn==0.5.8",
  "numpy==2.3.1",
  "torch==2.7.1",
]

release = [
  "build>=1.2,<2",
  "check-wheel-contents>=0.6,<1",
  "twine>=6,<7",
]

docs = [
  "furo>=2024.8.6",
  "myst-parser>=4,<5",
  "sphinx>=8,<10",
  "sphinx-copybutton>=0.5,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "mlx: requires a working MLX runtime",
  "metal: requires the MLX Metal backend on Apple Silicon",
  "e3nn_reference: requires the pinned upstream e3nn reference environment",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "e3nn_mlx._version.__version__"}

[tool.setuptools.packages.find]
include = ["e3nn_core*", "e3nn_backend*", "e3nn_mlx*"]

[tool.check-wheel-contents]
# One distribution intentionally provides the neutral core, backend protocol,
# and MLX runtime as three importable top-level packages.
toplevel = ["e3nn_backend", "e3nn_core", "e3nn_mlx"]
