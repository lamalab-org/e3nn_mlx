[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e3nn-mlx"
version = "0.1.0"
description = "Backend-neutral e3nn core with an MLX-native backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mlx = ["mlx>=0.31,<0.33"]
test = ["pytest>=9,<10", "numpy>=2.3,<3"]
reference = ["e3nn==0.5.8", "numpy==2.3.1", "torch==2.7.1"]

[tool.pytest.ini_options]
markers = [
  "mlx: requires a working MLX runtime",
  "e3nn_reference: requires the pinned upstream e3nn reference environment",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["e3nn_core*", "e3nn_backend*", "e3nn_mlx*"]
