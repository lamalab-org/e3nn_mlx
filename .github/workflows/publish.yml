name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag version
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(python -c "from e3nn_mlx._version import __version__; print(__version__)")
          test "$tag_version" = "$package_version"

      - name: Install packaging tools
        run: python -m pip install build check-wheel-contents twine

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          check-wheel-contents dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/e3nn-mlx/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
